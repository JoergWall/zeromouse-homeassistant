name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: pytest, mypy, ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: pip install -r requirements_test.txt
      - name: Lint
        run: ruff check custom_components/zeromouse
      - name: Types
        run: mypy --strict --ignore-missing-imports --follow-imports=silent custom_components/zeromouse
      - name: Tests
        run: pytest --cov=custom_components.zeromouse --cov-report=term-missing --cov-fail-under=95
