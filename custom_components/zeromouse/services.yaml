rate_event:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: zeromouse
    event_id:
      required: true
      example: "00000000-0000-0000-0000-000000000000"
      selector:
        text:
    rating:
      required: true
      selector:
        select:
          options:
            - correct
            - incorrect
            - none
          translation_key: rating

